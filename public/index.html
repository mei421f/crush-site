<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>یه چیزی برات دارم...</title>
<meta name="theme-color" content="#fbfbfd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient" aria-hidden="true"></div>
<div id="hearts-bg" aria-hidden="true"></div>

<div class="controls">
  <button class="ctrl-btn" id="soundBtn" type="button" aria-label="صدا" title="صدا">
    <svg viewBox="0 0 24 24" class="icon icon-sound-on"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M19 6a9 9 0 010 12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/></svg>
    <svg viewBox="0 0 24 24" class="icon icon-sound-off" hidden><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M15.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <button class="ctrl-btn" id="themeBtn" type="button" aria-label="تم" title="تم">
    <svg viewBox="0 0 24 24" class="icon icon-sun"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"/></g></svg>
    <svg viewBox="0 0 24 24" class="icon icon-moon" hidden><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" fill="currentColor"/></svg>
  </button>
</div>

<main class="wrap">
  <div class="card" id="card">

    <div class="progress hidden" id="progress" aria-hidden="true">
      <span class="dot active" data-step="1"></span>
      <span class="line"></span>
      <span class="dot" data-step="2"></span>
      <span class="line"></span>
      <span class="dot" data-step="3"></span>
    </div>

    <!-- مرحله‌ی صفر: بازی «چقدر همو می‌شناسیم» (فقط اگه از پنل ادمین فعال شده باشه) -->
    <section class="stage active" id="stage-quiz">
      <p class="eyebrow">قبلش یه بازی کوچولو</p>
      <div class="orb-wrap">
        <div class="orb orb-rose"></div>
        <svg viewBox="0 0 24 24" class="stage-icon heart-icon">
          <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M9.2 9.6c.2-1.6 1.4-2.6 2.9-2.6 1.5 0 2.7 1 2.7 2.3 0 1.1-.6 1.7-1.6 2.3-.9.6-1.3 1-1.3 1.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <circle cx="12" cy="16.6" r="1" fill="currentColor"/>
        </svg>
      </div>
      <h1 id="quiz-question">در حال بارگذاری...</h1>
      <p class="submsg" id="quiz-progress-text"></p>
      <div class="quiz-options" id="quiz-options"></div>
      <p class="quiz-feedback" id="quiz-feedback"></p>
    </section>

    <!-- مرحله ۱: سؤال اصلی -->
    <section class="stage" id="stage-question">
      <p class="eyebrow" id="eyebrow">برای یه نفر خاص</p>
      <div class="orb-wrap">
        <div class="orb orb-rose"></div>
        <svg viewBox="0 0 24 24" class="stage-icon heart-icon">
          <path d="M12 21s-7.5-4.6-10.1-9.3C.4 8.6 1.7 5 5.1 4.2 7.4 3.6 9.7 4.6 12 7c2.3-2.4 4.6-3.4 6.9-2.8 3.4.8 4.7 4.4 3.2 7.5C19.5 16.4 12 21 12 21z" fill="currentColor"/>
        </svg>
      </div>
      <h1 id="question-text">میشه مال من بشی؟</h1>
      <p id="message-text" class="msg"></p>
      <div class="btn-row" id="btn-row">
        <button id="yesBtn" class="btn btn-primary">بله</button>
        <button id="noBtn" class="btn btn-ghost">نه</button>
      </div>
      <div class="nudge" id="nudge"></div>
    </section>

    <!-- مرحله ۲: تایید + دعوت به دیت -->
    <section class="stage" id="stage-date">
      <p class="eyebrow">تایید شد</p>
      <div class="orb-wrap">
        <div class="orb orb-rose"></div>
        <svg viewBox="0 0 24 24" class="stage-icon check-icon">
          <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 id="answer-text">وای جدی؟! خیلی خوشحالم کردی</h1>
      <p class="msg" id="date-heading">بریم یه دیت باحال؟</p>
      <p class="submsg" id="date-message"></p>

      <div class="btn-row">
        <button id="dateYesBtn" class="btn btn-primary">بریم</button>
        <button id="dateLaterBtn" class="btn btn-ghost-2">بذار بعداً بگم</button>
      </div>

      <form class="date-form hidden" id="date-form">
        <div class="field">
          <label for="date-day">چه روزی خوبه؟</label>
          <div class="input-icon-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15.5" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17M8 3v3.4M16 3v3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input type="date" id="date-day" required>
          </div>
        </div>
        <div class="field">
          <label for="date-time">چه ساعتی؟</label>
          <div class="input-icon-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.7" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="time" id="date-time" required>
          </div>
        </div>
        <div class="field">
          <label for="date-note">یه پیام کوچولو <span class="optional">(اختیاری)</span></label>
          <textarea id="date-note" placeholder="مثلاً: اون کافه‌ای که دوست داری بریم"></textarea>
        </div>
        <button type="submit" class="btn btn-primary full" id="sendDateBtn">درخواست رو بفرست</button>
      </form>
    </section>

    <!-- مرحله ۳: پیام نهایی -->
    <section class="stage" id="stage-final">
      <p class="eyebrow">تمام شد</p>
      <div class="orb-wrap">
        <div class="orb orb-rose"></div>
        <svg viewBox="0 0 24 24" class="stage-icon spark-icon">
          <path d="M12 3l1.8 5.6L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.4L12 3z" fill="currentColor"/>
        </svg>
      </div>
      <h1 id="final-title">همه چی ثبت شد!</h1>
      <p class="msg" id="final-text">به زودی هماهنگ می‌کنیم، منتظر باش</p>
      <div class="btn-row">
        <button id="saveCardBtn" class="btn btn-ghost-2">ذخیره کارت خاطره</button>
      </div>
    </section>

  </div>
  <p class="footnote">دستت رو بردار، خوشحالت می‌کنه ✨</p>
</main>

<canvas id="confetti"></canvas>
<canvas id="memory-canvas" hidden></canvas>

<script src="script.js"></script>
</body>
</html>
